# The contracts the page relies on, checked on Base Sepolia itself: each address in
# tools/chain/code.json must still hold the code the local chain and the contract tests use. Weekly,
# and by hand. It reads a public RPC, so it is kept out of CI, where a rate limit would fail a push.
name: Chain check

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base-sepolia:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - run: node tools/chain/fetch.mjs --check
