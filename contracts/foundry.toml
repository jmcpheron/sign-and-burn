# Foundry 1.8.3 (the version the tests were run with). No libraries: nothing in lib/.
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [
    { access = "read", path = "../reference/vectors" },
    { access = "read", path = "../tools/chain" },
    { access = "read", path = "./deployment.json" },
]

[fuzz]
runs = 64

[profile.osaka]
# FOUNDRY_PROFILE=osaka forge test: Osaka's EVM, which Base Sepolia and anvil 1.8.3 run, with the
# P-256 precompile at 0x100 (EIP-7951), so the passkey signer checks there instead of with Daimo's
# verifier. Its build goes under out/ and cache/ so it never mixes with the default one.
evm_version = "osaka"
out = "out/osaka"
cache_path = "cache/osaka"
