<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1190" viewBox="0 0 480 1190" role="img" aria-labelledby="title desc"><title id="title">Create the passkey</title><desc id="desc">Illustrated schematic, not a native passkey prompt. navigator.credentials.create() Public P-256 key → page Save credential ID + public key No one-time seed requested No payment request yet No transaction or gas Not deployed No seat counter yet Public key ≠ fingerprint The passkey public key reaches the page now. The passkey private key is not returned.</desc><defs>
