nd" stroke-linejoin="round" /><path d="M-18 9c0-25 36-25 36 0v19" stroke="#8853bb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M-11 12c0-17 22-17 22 0v28" stroke="#8853bb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M-4 14v27" stroke="#8853bb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M-25 19v9M-18 20v18M-11 24v18" stroke="#8853bb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="240" y="319" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="650" text-anchor="middle" fill="#745216">P-256 private key + PRF secret</text><text x="240" y="341" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#846b42">Not returned by WebAuthn</text><path d="M240 362v25" stroke="#d65c44" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="101" y="394" width="278" height="165" rx="19" fill="#f5eafa" stroke="#d5bce6"/><text x="117" y="416" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="650" text-anchor="start" fill="#8853bb">PAGE + CONSOLE MEMORY</text><rect x="118" y="431" width="242" height="60" rx="8" fill="#fffdf9" stroke="#c8bdd1"/><text x="131" y="454" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#596c82">Recipient · value · Safe nonce</text><text x="131" y="478" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="650" text-anchor="start" fill="#20314b">Console builds Safe hash + c</text><text x="118" y="529" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="650" text-anchor="start" fill="#8853bb">Hold → verify → then sign</text><rect x="198" y="574" width="84" height="4" rx="2" fill="#8a8b9c" stroke="none"/><path d="M240 611v47" stroke="#c5c9d1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><text x="240" y="698" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="650" text-anchor="middle" fill="#596c82">NO COMPLETED APPROVAL SENT YET</text><g transform="translate(30 720)"><rect x="8" y="0" width="72" height="66" rx="9" fill="#edf0f2" stroke="#9eabb8"/><rect x="15" y="8" width="58" height="12" rx="3" fill="#fffdf9" stroke="#9eabb8"/><circle cx="64" cy="14" r="2" fill="#9eabb8"/><rect x="15" y="26" width="58" height="12" rx="3" fill="#fffdf9" stroke="#9eabb8"/><circle cx="64" cy="32" r="2" fill="#9eabb8"/><rect x="15" y="44" width="58" height="12" rx="3" fill="#fffdf9" stroke="#9eabb8"/><circle cx="64" cy="50" r="2" fill="#9eabb8"/></g><g transform="translate(194 720)"><path d="M8 0h45l18 18v51H8Z" fill="#fffdf9" stroke="#9eabb8" stroke-width="2"/><path d="M53 0v18h18" fill="#ddebfa" stroke="#9eabb8" stroke-width="2"/><path d="M27 30c-13-9-21 6-10 12l10 4c7 3 15-6 10-11M38 29c4-9 20-4 16 5l-4 10c-4 9-20 4-16-5" stroke="#9eabb8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(352 720)"><rect x="0" y="12" width="84" height="56" rx="9" fill="#dde1e5" stroke="#9eabb8"/><path d="M6 12V5h67v10" stroke="#9eabb8" stroke-width="2" fill="#edf0f2" stroke-linecap="round" stroke-linejoin="round" /><rect x="51" y="29" width="37" height="25" rx="5" fill="#bcc5ce" stroke="#9eabb8"/><circle cx="62" cy="41" r="3" fill="#ffe8c8"/><circle cx="14" cy="5" r="16" fill="#ffd67d" stroke="#cf9f3b" stroke-width="2"/><path d="M14 -5l-6 10 6 4 6-4Z" stroke="#a67520" stroke-width="1" fill="#fff1bd" stroke-linecap="round" stroke-linejoin="round" /></g><text x="74" y="813" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="650" text-anchor="middle" fill="#367ba9">RPC</text><text x="233" y="813" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="650" text-anchor="middle" fill="#367ba9">Copied link</text><text x="397" y="813" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="650" text-anchor="middle" fill="#956234">Gas payer</text><path d="M125 752H178" stroke="#9ab1bd" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M284 752H335" stroke="#9ab1bd" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="240" y="849" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#20314b">Read the transaction before the passkey tap.</text><rect x="22" y="875" width="436" height="152" rx="22" fill="#e9f5ee" stroke="none"/><text x="42" y="902" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="650" text-anchor="start" fill="#25846c">SEAT / ON-CHAIN COMMITMENT</text><g transform="translate(48 923)"><path d="M0 16L42 0L84 16L42 32Z" fill="#edf4f1"/><path d="M0 16v48l42 18V32Z" fill="#d3e7e3"/><path d="M42 32v50l42-18V16Z" fill="#acccc3"/><text x="23" y="51" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="650" text-anchor="start" fill="#245d50">old</text></g><g transform="translate(198 923)"><path d="M0 16L42 0L84 16L42 32Z" fill="#b2eddb"/><path d="M0 16v48l42 18V32Z" fill="#8cdbc5"/><path d="M42 32v50l42-18V16Z" fill="#57ad96"/><text x="23" y="51" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="650" text-anchor="start" fill="#245d50">F₀</text></g><g transform="translate(348 923)"><path d="M0 16L42 0L84 16L42 32Z" fill="#edf4f1"/><path d="M0 16v48l42 18V32Z" fill="#d3e7e3"/><path d="M42 32v50l42-18V16Z" fill="#acccc3"/><text x="23" y="51" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="650" text-anchor="start" fill="#245d50">next</text></g><path d="M141 962h39" stroke="#25846c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M291 962h39" stroke="#25846c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="240" y="1054" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="650" text-anchor="middle" fill="#20314b">Still F₀ · seat n = 0 · Safe nonce = 0</text><text x="24" y="1090" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="650" text-anchor="start" fill="#d65c44">n is a key index, not a random nonce</text><text x="24" y="1146" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#596c82">Gold: passkey · violet: seeds · blue: public values</text><text x="24" y="1168" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#596c82">Illustrated objects only. Fₙ is a hash, not a secret seed.</text></svg>