<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1190" viewBox="0 0 480 1190" role="img" aria-labelledby="title desc"><title id="title">Review before signing with key 0</title><desc id="desc">Illustrated schematic, not a native passkey prompt. No approval assertion yet Waiting for user verification Console builds Safe hash + c c binds chain, seat, Safe, n and hash No completed approval disclosed yet Hold → then the passkey prompt Seat still holds F₀ Seat n = 0 · Safe nonce = 0 n is a key index, not a random nonce The Safe transaction also has its own nonce. The seat reads n from chain; the payer cannot choose it.</desc><defs>
<linearGradient id="phone" x2="1" y2="1"><stop stop-color="#344763"/><stop offset="1" stop-color="#16243b"/></linearGradient>
<linearGradient id="screen" x2="0" y2="1"><stop stop-color="#fff9ef"/><stop offset="1" stop-color="#f1eaff"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0l9 5-9 5Z" fill="#d65c44"/></marker>
